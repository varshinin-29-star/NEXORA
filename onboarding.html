<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexora — Onboarding</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #070911;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: #0e131f;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 22px;
            padding: 45px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.45);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .logo span {
            color: #8b6cff;
        }

        .progress {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .progress div {
            width: 70px;
            height: 5px;
            border-radius: 10px;
            background: #252b3a;
        }

        .progress .active {
            background: linear-gradient(90deg, #8b6cff, #42c8ff);
        }
